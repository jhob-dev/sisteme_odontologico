{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Consultorio Odontológico</title>
    <style>
        @font-face {
            font-family: 'Poppins';
            src: url('{% static "fonts/poppins-light.woff2" %}') format('woff2');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Poppins';
            src: url('{% static "fonts/poppins-regular.woff2" %}') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Poppins';
            src: url('{% static "fonts/poppins-medium.woff2" %}') format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Poppins';
            src: url('{% static "fonts/poppins-semibold.woff2" %}') format('woff2');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Poppins';
            src: url('{% static "fonts/poppins-bold.woff2" %}') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 50%, #e8eaf6 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .login-container {
            margin: auto;
            background: white;
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(236, 64, 122, 0.3);
            max-width: 450px;
            width: 100%;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
            font-size: 80px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            text-align: center;
            color: #880e4f;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            color: #880e4f;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #f8bbd0;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }
        input:focus {
            outline: none;
            border-color: #ec407a;
            box-shadow: 0 0 0 4px rgba(236, 64, 122, 0.1);
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ec407a 0%, #ab47bc 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(236, 64, 122, 0.4);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(236, 64, 122, 0.5);
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        .toast {
            min-width: 320px;
            padding: 18px 25px;
            margin-bottom: 15px;
            border-radius: 15px;
            color: white;
            font-weight: 500;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.4s ease-out;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .toast-success {
            background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%);
        }
        .toast-error {
            background: linear-gradient(135deg, #ef5350 0%, #e53935 100%);
        }
        .toast-warning {
            background: linear-gradient(135deg, #ffa726 0%, #fb8c00 100%);
        }
        .toast-info {
            background: linear-gradient(135deg, #42a5f5 0%, #1e88e5 100%);
        }
        .toast-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            margin-left: 15px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        .toast-close:hover {
            opacity: 1;
        }
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
        footer {
            background: linear-gradient(135deg, #ec407a 0%, #ab47bc 100%);
            color: white;
            text-align: center;
            padding: 25px 20px;
            margin-top: 40px;
            border-radius: 20px;
            font-size: 14px;
            box-shadow: 0 8px 25px rgba(236, 64, 122, 0.3);
        }
        footer .footer-titulo {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 10px;
        }
        footer .footer-nombres {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 25px;
            font-weight: 500;
        }
        footer .footer-nombres span {
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🦷</div>
        <h1>Consultorio Odontológico</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required autofocus placeholder="Ingresa tu usuario">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">
            </div>
            
            <button type="submit" class="btn">🚀 Iniciar Sesión</button>
        </form>
    </div>
    <footer>
        <div>
            <p class="footer-titulo">Diseñado por los estudiantes del Programa Nacional de Formación en Informática (PNFI) Trayecto III:</p>
            <div class="footer-nombres">
                <span>Corvo Rossy</span>
                <span>Flores Josiel</span>
                <span>López German</span>
                <span>Marcano Jhobanni</span>
                <span>Rodríguez Jesus</span>
                <span>Vallejo Zaidymar</span>
            </div>
        </div>
    </footer>
    
    <div class="toast-container" id="toastContainer"></div>
    
    <script>
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <span>${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            {% if messages %}
                {% for message in messages %}
                    showToast('{{ message }}', '{{ message.tags }}');
                {% endfor %}
            {% endif %}
        });
    </script>
</body>
</html>
