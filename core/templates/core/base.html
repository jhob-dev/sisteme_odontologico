<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Consultorio Odontológico{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 50%, #e8eaf6 100%);
            line-height: 1.6;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background: linear-gradient(135deg, #ec407a 0%, #ab47bc 100%);
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(236, 64, 122, 0.3);
        }
        header h1 {
            text-align: center;
            font-size: 32px;
            font-weight: 600;
        }
        nav {
            background: linear-gradient(135deg, #f48fb1 0%, #ce93d8 100%);
            padding: 15px 0;
            box-shadow: 0 2px 10px rgba(244, 143, 177, 0.3);
        }
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 25px;
            transition: all 0.3s ease;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        nav a:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(236, 64, 122, 0.15);
            border: 1px solid rgba(236, 64, 122, 0.1);
        }
        .card h3 {
            color: #880e4f;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ec407a 0%, #ab47bc 100%);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 14px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(236, 64, 122, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%);
        }
        .btn-success:hover {
            box-shadow: 0 6px 20px rgba(102, 187, 106, 0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef5350 0%, #e53935 100%);
        }
        .btn-danger:hover {
            box-shadow: 0 6px 20px rgba(239, 83, 80, 0.4);
        }
        .btn-warning {
            background: linear-gradient(135deg, #ffa726 0%, #fb8c00 100%);
        }
        .btn-warning:hover {
            box-shadow: 0 6px 20px rgba(255, 167, 38, 0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(236, 64, 122, 0.1);
            table-layout: auto;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #fce4ec;
            word-wrap: break-word;
            min-width: 100px;
        }
        th {
            background: linear-gradient(135deg, #ec407a 0%, #ab47bc 100%);
            color: white;
            font-weight: 600;
            white-space: nowrap;
        }
        tr:hover {
            background-color: #fce4ec;
        }
        .table-responsive {
            overflow-x: auto;
            border-radius: 15px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #880e4f;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #f8bbd0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ec407a;
            box-shadow: 0 0 0 3px rgba(236, 64, 122, 0.1);
        }
        input[type="checkbox"] {
            width: auto;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .field-error {
            display: block;
            margin-top: 6px;
            color: #c62828;
            font-size: 13px;
            font-weight: 500;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(236, 64, 122, 0.15);
            border: 1px solid rgba(236, 64, 122, 0.1);
            transition: transform 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-card h3 {
            font-size: 48px;
            color: #ec407a;
            margin-bottom: 10px;
        }
        .stat-card p {
            color: #7b1fa2;
            font-size: 16px;
            font-weight: 500;
        }
        .badge {
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-pendiente {
            background-color: #ffa726;
            color: white;
        }
        .badge-confirmada {
            background-color: #42a5f5;
            color: white;
        }
        .badge-completada {
            background-color: #66bb6a;
            color: white;
        }
        .badge-cancelada {
            background-color: #ef5350;
            color: white;
        }
        .horario-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .horario-day {
            background: white;
            padding: 20px;
            border-radius: 15px;
            min-height: 200px;
            box-shadow: 0 4px 15px rgba(236, 64, 122, 0.1);
        }
        .horario-day h4 {
            text-align: center;
            margin-bottom: 15px;
            color: #880e4f;
            font-size: 16px;
        }
        .cita-item {
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 100%);
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            font-size: 12px;
            border-left: 3px solid #ec407a;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        .toast {
            min-width: 320px;
            padding: 18px 25px;
            margin-bottom: 15px;
            border-radius: 15px;
            color: white;
            font-weight: 500;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.4s ease-out;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .toast-success {
            background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%);
        }
        .toast-error {
            background: linear-gradient(135deg, #ef5350 0%, #e53935 100%);
        }
        .toast-warning {
            background: linear-gradient(135deg, #ffa726 0%, #fb8c00 100%);
        }
        .toast-info {
            background: linear-gradient(135deg, #42a5f5 0%, #1e88e5 100%);
        }
        .toast-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            margin-left: 15px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        .toast-close:hover {
            opacity: 1;
        }
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
        h2 {
            color: #880e4f;
            margin-bottom: 25px;
            font-size: 28px;
        }
        /* ===== Estilos para Reportes ===== */
        .reporte-doc {
            background: #ffffff;
            border: 2px solid #880e4f;
            border-radius: 12px;
            padding: 35px 40px;
            margin-bottom: 25px;
        }
        .reporte-encabezado {
            text-align: center;
            border-bottom: 3px double #880e4f;
            padding-bottom: 18px;
            margin-bottom: 25px;
        }
        .reporte-encabezado h2 {
            margin-bottom: 5px;
            font-size: 26px;
        }
        .reporte-encabezado h3 {
            color: #880e4f;
            font-size: 20px;
            margin-bottom: 8px;
        }
        .reporte-encabezado p {
            color: #7b1fa2;
            font-size: 14px;
        }
        .reporte-filtros {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            background: #fce4ec;
            border: 1px solid #f8bbd0;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 25px;
        }
        .reporte-filtro {
            border: 1px solid #ec407a;
            border-radius: 8px;
            padding: 8px 15px;
            background: #ffffff;
            font-size: 14px;
        }
        .reporte-filtro strong {
            color: #880e4f;
        }
        .reporte-resumen {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .reporte-stat {
            border: 2px solid #ec407a;
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
            background: #ffffff;
        }
        .reporte-stat .valor {
            font-size: 28px;
            font-weight: 700;
            color: #880e4f;
            display: block;
        }
        .reporte-stat .etiqueta {
            font-size: 13px;
            color: #7b1fa2;
            font-weight: 500;
        }
        .reporte-seccion {
            margin-bottom: 10px;
        }
        .reporte-seccion > h4 {
            color: #880e4f;
            font-size: 17px;
            margin-bottom: 10px;
            border-left: 5px solid #ec407a;
            padding-left: 10px;
        }
        .reporte-tabla {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
        }
        .reporte-tabla th,
        .reporte-tabla td {
            border: 1px solid #880e4f;
            padding: 10px 12px;
            text-align: left;
            font-size: 14px;
        }
        .reporte-tabla th {
            background: #f8bbd0;
            color: #880e4f;
            font-weight: 600;
            white-space: nowrap;
        }
        .reporte-tabla tbody tr:nth-child(even) {
            background: #fdf2f7;
        }
        .reporte-tabla tbody tr:hover {
            background: #fce4ec;
        }
        .reporte-vacio td {
            text-align: center;
            color: #7b1fa2;
            padding: 20px;
        }
        .reporte-pie {
            margin-top: 30px;
            padding-top: 12px;
            border-top: 1px solid #cccccc;
            text-align: center;
            font-size: 12px;
            color: #999999;
        }
        @media print {
            nav, header, .no-print {
                display: none !important;
            }
            body {
                background: #ffffff;
            }
            .container {
                max-width: 100%;
                padding: 0;
            }
            .reporte-doc {
                border: none;
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🦷 Consultorio Odontológico</h1>
        </div>
    </header>
    <nav>
        <div class="container">
            <ul>
                <li><a href="{% url 'dashboard' %}">🏠 Dashboard</a></li>
                <li><a href="{% url 'lista_pacientes' %}">👥 Pacientes</a></li>
                <li><a href="{% url 'lista_citas' %}">📅 Citas</a></li>
                <li><a href="{% url 'lista_pagos' %}">💰 Pagos</a></li>
                <li><a href="{% url 'horario_semanal' %}">🗓️ Horario</a></li>
                <li><a href="{% url 'reportes' %}">📊 Reportes</a></li>
                <li><a href="{% url 'logout' %}" class="btn btn-danger" style="padding: 12px 25px;">🚪 Cerrar Sesión</a></li>
            </ul>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <div class="toast-container" id="toastContainer"></div>
    
    <script>
        function warnInvalidInput(input, message) {
            const now = Date.now();
            if (now - (input._lastInputWarning || 0) < 1000) {
                return;
            }
            input._lastInputWarning = now;
            showToast(message, 'warning');
        }

        function sanitizeNumericInput(input) {
            const cleaned = input.value.replace(/[^0-9]/g, '');
            if (cleaned !== input.value) {
                input.value = cleaned;
                warnInvalidInput(input, 'Este campo solo admite números.');
            }
        }

        function sanitizePhoneInput(input) {
            const cleaned = input.value.replace(/[^0-9+()\-\s]/g, '');
            if (cleaned !== input.value) {
                input.value = cleaned;
                warnInvalidInput(input, 'Este campo solo admite números y los caracteres + ( ) - o espacios.');
            }
        }

        function sanitizeDecimalInput(input) {
            let cleaned = input.value.replace(/[^0-9.,]/g, '');
            if (cleaned.includes(',') && !cleaned.includes('.')) {
                cleaned = cleaned.replace(',', '.');
            }
            cleaned = cleaned.replace(/[^0-9.]/g, '');
            const firstDot = cleaned.indexOf('.');
            if (firstDot !== -1) {
                cleaned = cleaned.slice(0, firstDot + 1) + cleaned.slice(firstDot + 1).replace(/\./g, '');
            }
            if (cleaned !== input.value) {
                input.value = cleaned;
                warnInvalidInput(input, 'Este campo solo admite números y un punto decimal.');
            }
        }

        function initializeInputValidation() {
            document.querySelectorAll('[data-numeric-only]').forEach(function(input) {
                input.addEventListener('input', function() {
                    sanitizeNumericInput(input);
                });
            });
            document.querySelectorAll('[data-phone-input]').forEach(function(input) {
                input.addEventListener('input', function() {
                    sanitizePhoneInput(input);
                });
            });
            document.querySelectorAll('[data-decimal-only]').forEach(function(input) {
                input.addEventListener('input', function() {
                    sanitizeDecimalInput(input);
                });
            });
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <span>${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            initializeInputValidation();
            {% if messages %}
                {% for message in messages %}
                    showToast('{{ message }}', '{{ message.tags }}');
                {% endfor %}
            {% endif %}
        });
    </script>
</body>
</html>
